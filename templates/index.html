<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auralia</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

    <header>
        <h1 class="logo">Auralia</h1>
        <nav>
            <ul>
                <li><a href="{{ url_for('index') }}" class="active">Home</a></li>
                <li><a href="{{ url_for('products') }}">Products</a></li>
                <li><a href="{{ url_for('artists') }}">Artists</a></li>
                <li><a href="{{ url_for('customers') }}">Customers</a></li>
                <li><a href="{{ url_for('input') }}">Input</a></li>
            </ul>
        </nav>
    </header>

    <main class="homepage">
        <div class="welcome-box">
            <h2>Welcome to Auralia!</h2>
            <p>Your world of music, vinyls, and unforgettable sounds</p>
            <a href="{{ url_for('products') }}" class="cta-button">Explore Albums</a>
        </div>

        <!-- Vinyl and album decorations-->
         <div class="vinyl-decor">
            <img src="{{ url_for('static', filename='vinyl1.png') }}" class="vinyl1">
            <img src="{{ url_for('static', filename='vinyl2.png') }}" class="vinyl2">
            <img src="{{ url_for('static', filename='vinyl3.png') }}" class="vinyl3">
            <img src="{{ url_for('static', filename='vinyl4.png') }}" class="vinyl4">
            <img src="{{ url_for('static', filename='album_sleeve1.png') }}" class="sleeve sleeve1">
            <img src="{{ url_for('static', filename='album_sleeve2.png') }}" class="sleeve sleeve2">
         </div>
    </main>

    <footer>
        <p>&copy; 2025 Auralia &nbsp; |&nbsp; <a href="{{ url_for('imprint') }}" class="imprint-link">Imprint</a></p>
    </footer>

</body>
</html>
