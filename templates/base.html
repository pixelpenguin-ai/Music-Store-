<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Auralia{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header>
        <h1 class="logo">Auralia</h1>
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Auralia logo" class="logo-img">
        <nav>
            <ul>
                <li><a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">Home</a></li>
                <li><a href="{{ url_for('customers') }}" class="{% if request.endpoint == 'customers' %}active{% endif %}">Customers</a></li>
                <li><a href="{{ url_for('products') }}" class="{% if request.endpoint == 'products' %}active{% endif %}">Products</a></li>
                <li><a href="{{ url_for('artists') }}" class="{% if request.endpoint == 'artists' %}active{% endif %}">Artists</a></li>
                <li><a href="{{ url_for('imprint') }}" class="{% if request.endpoint == 'imprint' %}active{% endif %}">Imprint</a></li>
            </ul>
        </nav>
    </header>

    {% with messages = get_flashed_messages(with_categories=true) %}
    
  {% if messages %}
    <ul class="flashes">
      {% for category, message in messages %}
        <li class="{{ category }}">{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}

{% endwith %}



    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
