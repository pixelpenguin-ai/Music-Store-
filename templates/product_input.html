{% extends "base.html" %}
{% block title %}Add Product{% endblock %}
{% block content %}

<div class="product-input">
<div class="card shadow mt-5">
    <div class="card-header bg-primary text-white">Add Product</div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('add_product') }}">
            <div class="mb-3">
                <label class="form-label">Product Title</label>
                <input type="text" name="product_title" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Price</label>
                <input type="number" step="0.01" name="price" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Genre</label>
                <input type="text" name="genre" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Release Date</label>
                <input type="date" name="release_date" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Media</label>
                <input type="text" name="media" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">In Stock</label>
                <input type="number" name="in_stock" class="form-control" min="0">
            </div>

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input class="form-control" type="text" name="username" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input class="form-control" type="password" name="password" required>
            </div>

            <button type="submit" class="btn btn-primary">Submit</button>
            <a href="{{ url_for('input') }}" class="btn btn-secondary">Back</a>

        </form>
    </div>
</div>
</div>

{% endblock %}
