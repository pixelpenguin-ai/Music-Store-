{% extends "base.html" %}
{% block title %}Add Artist{% endblock %}

{% block content %}
<div class="artist-input">
<div class="card mt-5">
    <div class="card-header bg-info text-white">Add Artist</div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('add_artist') }}">
            <div class="mb-3">
                <label class="form-label">Artist Name</label>
                <input type="text" name="artist_name" class="form-control" required>
            </div>
            <div class="mb-3-notes">
                <label class="form-label">Notes</label>
                <input class="form-control" name="notes" type="text" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input class="form-control" type="text" name="username" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input class="form-control" type="password" name="password" required>
            </div>

            <button type="submit" class="btn btn-success">Submit</button>
            <a href="{{ url_for('input') }}" class="btn btn-secondary">Back</a>
        </form>
    </div>
</div>
</div>
{% endblock %}
