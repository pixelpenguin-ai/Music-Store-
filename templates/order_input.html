{% extends "base.html" %}
{% block title %}Add Order{% endblock %}
{% block content %}

<div class="card shadow mt-5">
    <div class="card-header bg-primary text-white">Add Order</div>
    <div class="card-body">
<form method="POST">
    <div class="mb-3">
        <label class="form-label">Customer</label>
        <select name="customer_id" class="form-control" required>
            {% for customer in customers %}
            <option value="{{ customer.customer_id }}">{{ customer.first_name }} {{ customer.last_name }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Order Date</label>
        <input type="date" name="order_date" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Filled</label>
        <select name="filled" class="form-control" required>
            <option value="True">Yes</option>
            <option value="False">No</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Quantity</label>
        <input type="number" name="quantity" class="form-control" min="1" value="1" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Unit Price</label>
        <input type="number" name="unit_price" class="form-control" placeholder="Enter unit price" step="0.01">
    </div>

    <div class="d-grid gap-2">
        <button type="submit" class="btn btn-success">Submit</button>
        <a href="{{ url_for('orders') }}" class="btn btn-secondary">Back to Maintenance</a>
    </div>
</form>


{% endblock %}
