{% extends "base.html" %}
{% block title %}Add Customer{% endblock %}
{% block content %}

<div class="customer-input">
<div class="card mt-5">
    <div class="card-header bg-info text-white">Add Customer</div>
    <div class="card-body">
        <form method="POST">
            
            <div class="mb-3">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="mb-3">
                <label for="password">Password</label>
                <input type="password" id="'password" name="password" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Customer Name</label>
                <input type="text" name="first_name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Customer Family Name</label>
                <input type="text" name="last_name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="text" name="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone number</label>
                <input type="number" name= "phone_number" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Street</label>
                <input type="text" name="street" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">City</label>
                <input type="text" name="city" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">ZIP</label>
                <input type="text" name="zip" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Preffered Genre</label>
                <input type="text" name="preffered_genre" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
            <a href="{{ url_for('input') }}" class="btn btn-secondary">Back</a>


        </form>
    </div>
</div>
</div>

{%endblock%}
